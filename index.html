<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06020e">
<title>Happy Diwali from Pranav Gupta 🎆</title>
<meta property="og:title" content="Happy Diwali from Pranav Gupta 🎆">
<meta property="og:description" content="Hold. Charge. Release. Watch the sky spell your wish.">
<style>
  :root{--gold:#ffd36b;--orange:#ff8a1f;--pink:#ff3d8b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#06020e;color:#fff;font-family:Georgia,"Times New Roman",serif;
            touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;inset:0;pointer-events:none}

  #mute{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 34px);right:12px;width:40px;height:40px;border-radius:50%;
        border:1px solid rgba(255,211,107,.35);background:rgba(10,5,22,.5);color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;padding:0 18px;transition:opacity .8s}
  #hint.hide{opacity:0;visibility:hidden}
  #hintT{font-size:clamp(14px,min(4vw,3vh),21px);letter-spacing:.1em;color:#ffe2b0;text-shadow:0 2px 14px #000;animation:pulse 2.4s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .dots{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,211,107,.6);transition:all .5s}
  .dots i.on{background:var(--gold);box-shadow:0 0 12px var(--orange);border-color:var(--gold)}
  .link{pointer-events:auto;display:none;margin:14px auto 0;background:none;border:0;border-bottom:1px dashed rgba(255,211,107,.6);color:var(--gold);font:inherit;font-size:14px;letter-spacing:.08em;cursor:pointer;padding:2px 0}
  .link.show{display:block;animation:fadein 1s}
  @keyframes fadein{from{opacity:0}}

  #card{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);width:min(92vw,560px);padding:clamp(12px,2.4vh,22px) 18px clamp(12px,2.2vh,18px);
        border-radius:24px;background:rgba(10,5,22,.58);border:1px solid rgba(255,211,107,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        text-align:center;opacity:0;visibility:hidden;transform:translate(-50%,24px) scale(.96);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,1.2,.4,1)}
  #card.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
  #forLine{display:none;font-size:clamp(12px,3.2vw,15px);letter-spacing:.2em;text-transform:uppercase;color:#c9b6dd;margin-bottom:4px}
  h1{font-size:clamp(34px,min(11.5vw,9.5vh),84px);line-height:1.05;font-weight:700;white-space:nowrap}
  h1 span{display:inline-block;opacity:0;transform:translateY(20px) scale(.7);filter:blur(8px);
          background:linear-gradient(180deg,#fff8d6,var(--gold) 50%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .sp{width:.26em}
  #card.show h1 span{animation:rise .9s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--i)*70ms + 300ms)}
  @keyframes rise{to{opacity:1;transform:none;filter:drop-shadow(0 0 12px rgba(255,150,40,.7))}}
  .hi{font-size:clamp(16px,min(5vw,4vh),30px);color:#ffe6c0;text-shadow:0 0 16px rgba(255,140,40,.8);font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",serif;margin-top:2px}
  .from{margin-top:.35em;font-size:clamp(15px,min(4.4vw,3.6vh),26px);color:#ffe6c0;font-style:italic}
  .from b{font-style:normal;letter-spacing:.09em;text-transform:uppercase;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tip{margin-top:8px;font-size:clamp(11px,3vw,13px);color:#a995bd;letter-spacing:.06em}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .btns button{pointer-events:auto;padding:9px 20px;border-radius:40px;border:1px solid rgba(255,211,107,.55);background:rgba(255,160,50,.14);color:var(--gold);
               font:inherit;font-size:clamp(13px,3.5vw,15px);letter-spacing:.08em;cursor:pointer}
  .btns button:active{transform:scale(.96)}

  @media (max-height:520px) and (orientation:landscape){
    #hint{bottom:12px}.dots{margin-top:8px}
    #card{padding:8px 14px 8px;border-radius:16px;bottom:8px}
    .hi,.tip{display:none}.btns{margin-top:6px}
    #mute{top:30px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <button id="mute" aria-label="Toggle sound">🔊</button>

  <div id="hint">
    <p id="hintT">Press &amp; hold anywhere to charge a rocket</p>
    <div class="dots"><i></i><i></i><i></i></div>
    <button id="auto" class="link">or just show me ▶</button>
  </div>

  <div id="card">
    <p id="forLine"></p>
    <h1 id="h1" aria-label="Happy Diwali"></h1>
    <p class="hi">शुभ दीपावली</p>
    <p class="from">from <b>Pranav Gupta</b></p>
    <p class="tip">Drag to write with a sparkler · tap for fireworks</p>
    <div class="btns"><button id="share">Share ✨</button><button id="replay">Replay ↺</button></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let W=0,H=0,DPR=1,textCY=0;

// optional personalisation: ?to=Name
const to=(new URLSearchParams(location.search).get('to')||'').slice(0,24).replace(/[<>&"]/g,'');
if(to){$('forLine').textContent='for '+to;$('forLine').style.display='block'}

// card title letters
[...'Happy Diwali'].forEach((ch,i)=>{const s=document.createElement('span');s.style.setProperty('--i',i);if(ch===' '){s.className='sp';s.innerHTML='&nbsp;'}else s.textContent=ch;$('h1').appendChild(s)});

// ---------- state ----------
let stage=0,finale=false,busy=false,muted=false,ptr=null,chargeP=0,lastInteract=performance.now();
const P=[],sparks=[],rockets=[],smoke=[],fountains=[],chakris=[];
const stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.3+.3,p:Math.random()*6}));
let buildings=[],bulbs=[],wires=[];
const HINTS=['Press & hold anywhere to charge a rocket','Nice! Hold again — let the ring fill','Last one… hold and release!'];
const HOLD=2800;
let holdUntil=0;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  textCY=H*(W<H?.33:.38);
  const r=rng(11),sc=clamp(W/420,.8,1.6);buildings=[];let x=-10;
  while(x<W+10){
    const bw=(26+r()*44)*sc,bh=(.04+r()*.1)*H*(H<500?.7:1),b={x,w:bw,h:bh,spire:r()<.2,dome:r()<.12,win:[]};
    const cols=Math.floor((bw-8)/10),rows=Math.floor((bh-10)/15);
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)b.win.push({x:x+6+i*10,y:H-bh+8+j*15,th:r()});
    buildings.push(b);x+=bw+(r()<.3?4:0);
  }
  bulbs=[];wires=[];const segs=Math.max(2,Math.round(W/230)),sw=W/segs,sag=clamp(W*.045,14,26),y0=6;
  for(let s=0;s<segs;s++){
    const ax=s*sw,bx=(s+1)*sw,cx=(ax+bx)/2,cy=y0+sag*2;wires.push([ax,y0,cx,cy,bx,y0]);
    const n=Math.max(4,Math.round(sw/30));
    for(let k=1;k<n;k++){const u=k/n;bulbs.push({x:(1-u)*(1-u)*ax+2*(1-u)*u*cx+u*u*bx,y:(1-u)*(1-u)*y0+2*(1-u)*u*cy+u*u*y0+3,c:(s*7+k)%5,ph:Math.random()*6})}
  }
}
addEventListener('resize',resize);resize();

// ---------- sound ----------
let ac,chOsc=null,chGain=null;
function AC(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function noise(dur,fn){const a=AC(),n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=fn(i/n);return b}
function boom(big){if(muted)return;try{const a=AC(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noise(.5,t=>(Math.random()*2-1)*Math.pow(1-t,3));f.type='lowpass';f.frequency.value=big?420:300;g.gain.value=big?.28:.16;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
  const c=a.createBufferSource(),cg=a.createGain();c.buffer=noise(.9,t=>Math.random()<.006?(Math.random()*2-1)*(1-t):0);cg.gain.value=.5;c.connect(cg);cg.connect(a.destination);c.start(a.currentTime+.12)}catch(e){}}
function whoosh(){if(muted)return;try{const a=AC(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;
  s.buffer=noise(1,x=>(Math.random()*2-1));f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2600,t+.95);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+1);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
function chime(){if(muted)return;try{const a=AC(),t=a.currentTime;[523.25,659.25,783.99,1046.5].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.12,t+i*.12+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+1.6);
  o.connect(g);g.connect(a.destination);o.start(t+i*.12);o.stop(t+i*.12+1.7)})}catch(e){}}
function chargeStart(){if(muted)return;try{const a=AC();chOsc=a.createOscillator();chGain=a.createGain();chOsc.type='sawtooth';chOsc.frequency.value=110;
  chGain.gain.setValueAtTime(.0001,a.currentTime);chGain.gain.linearRampToValueAtTime(.03,a.currentTime+.12);chOsc.connect(chGain);chGain.connect(a.destination);chOsc.start()}catch(e){chOsc=null}}
function chargeUpdate(p){if(chOsc){try{chOsc.frequency.value=110+p*520}catch(e){}}}
function chargeStop(){if(chOsc){try{const t=AC().currentTime;chGain.gain.linearRampToValueAtTime(.0001,t+.06);chOsc.stop(t+.08)}catch(e){}chOsc=null}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(muted)chargeStop()});

// ---------- sparks & effects ----------
function addSpark(s){if(sparks.length<2200)sparks.push(s)}
function burst(x,y,hue,n,spd){
  boom(n>70);
  const kind=Math.random(),k=clamp(W/700,.7,1.2)*(spd||1);
  for(let i=0;i<n;i++){
    const a=i/n*TAU;let sp=kind<.4?4.2:kind<.7?rnd(2,6):(i%2?5:2.5),vx=Math.cos(a)*sp*k,vy=Math.sin(a)*sp*k;
    if(kind>.88){vx=16*Math.pow(Math.sin(a),3)*.28*k;vy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*.28*k}
    addSpark({x,y,vx,vy,a:1,d:rnd(.011,.021),h:(hue+rnd(0,50))%360,g:.045,k:0,l:60});
  }
  for(let i=0;i<4;i++)smoke.push({x:x+rnd(-30,30),y:y+rnd(-20,20),r:rnd(30,60),a:.07,vx:rnd(-.15,.15)});
}
function launchPlain(tx,ty){
  const sx=clamp(tx+rnd(-30,30),10,W-10);
  rockets.push({sx,sy:H-6,tx,ty,u:0,du:1/rnd(55,80),word:-1,power:.6,hue:rnd(0,360)});whoosh();
}
function launchWord(sx,sy,power){
  const w=stage;stage++;busy=true;
  dissolve();
  rockets.push({sx,sy,tx:W/2,ty:textCY,u:0,du:1/(95-power*40),word:w,power,hue:rnd(20,60)});
  whoosh();vib(25);ui();
}
function ui(){
  document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<stage));
  $('hintT').textContent=HINTS[Math.min(stage,2)];
}
function dissolve(){P.forEach(p=>{if(p.phase<3){p.phase=3;p.vx=rnd(-1.3,1.3);p.vy=rnd(-2,.3);p.fd=rnd(.008,.022)}})}

// ---------- text -> particle targets ----------
function getLines(i){
  if(i===0)return[{t:'HAPPY',s:1}];
  if(i===1)return[{t:'DIWALI',s:1}];
  return W<H?[{t:'from',s:.42,serif:1},{t:'PRANAV',s:1},{t:'GUPTA',s:1}]:[{t:'from',s:.4,serif:1},{t:'PRANAV GUPTA',s:1}];
}
function buildTargets(lines){
  const fontOf=(l,px)=>l.serif?'italic 700 '+px+'px Georgia,"Times New Roman",serif':'900 '+px+'px "Arial Black","Helvetica Neue",Impact,Arial,sans-serif';
  const o=document.createElement('canvas');o.width=W;o.height=H;const oc=o.getContext('2d',{willReadFrequently:true});
  const maxW=W*.88,maxH=H*(W<H?.3:.4);let base=Math.min(H*.2,170),sumS=0;
  lines.forEach(l=>{oc.font=fontOf(l,100);const m=oc.measureText(l.t).width;base=Math.min(base,maxW*100/(m*l.s));sumS+=l.s*1.15});
  base=Math.min(base,maxH/sumS);
  let y=textCY-base*sumS/2;oc.fillStyle='#fff';oc.textAlign='center';oc.textBaseline='middle';
  lines.forEach(l=>{const lh=base*l.s*1.15;oc.font=fontOf(l,base*l.s);oc.fillText(l.t,W/2,y+lh/2);y+=lh});
  const data=oc.getImageData(0,0,W,H).data;let step=clamp(Math.round(base/15),3,7),pts;
  for(let tries=0;tries<4;tries++){
    pts=[];for(let yy=0;yy<H;yy+=step)for(let xx=0;xx<W;xx+=step)if(data[(yy*W+xx)*4+3]>140)pts.push({x:xx+rnd(-.8,.8),y:yy+rnd(-.8,.8)});
    if(pts.length<=1500)break;step++;
  }
  return pts;
}
function formWord(i,bx,by){
  const pts=buildTargets(getLines(i)),cols=i===2?[42,48,332,30]:[40,46,50,36];
  pts.forEach(t=>{const a=rnd(0,TAU),sp=rnd(2,10),h=cols[Math.floor(Math.random()*cols.length)];
    P.push({x:bx,y:by,tx:t.x,ty:t.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,delay:Math.floor(rnd(0,22)),phase:0,a:1,ph:rnd(0,6),fd:0,
            col:'hsl('+h+',100%,'+Math.floor(rnd(60,86))+'%)',s:rnd(1.1,1.9)})});
  holdUntil=performance.now()+HOLD;
}

function explode(r){
  burst(r.tx,r.ty,r.hue,Math.round(52+r.power*44));
  if(r.word>=0){
    formWord(r.word,r.tx,r.ty);busy=false;chime();
    const n=Math.round(r.power*5);
    for(let i=0;i<n;i++)setTimeout(()=>burst(rnd(W*.1,W*.9),rnd(H*.08,H*.55),rnd(0,360),rnd(34,52),.8),200+i*260);
    if(r.word===2)setTimeout(startFinale,2300);
  }
}

// ---------- finale ----------
function startFinale(){
  if(finale)return;finale=true;
  $('hint').classList.add('hide');$('card').classList.add('show');vib([40,60,40,60,120]);
  setTimeout(dissolve,500);
  const now=performance.now();
  for(let k=0;k<10;k++)setTimeout(()=>launchPlain(rnd(W*.1,W*.9),rnd(H*.08,H*.5)),k*330);
  [.07,.93,.3,.7].forEach((fx,i)=>fountains.push({x:W*fx,y:H-4,until:now+9000+i*600}));
  [.18,.82].forEach(fx=>chakris.push({x:W*fx,y:H-40,until:now+7000,ang:0,w:.05}));
}
function reset(){
  finale=false;busy=false;stage=0;P.length=0;sparks.length=0;rockets.length=0;fountains.length=0;chakris.length=0;
  $('card').classList.remove('show');$('hint').classList.remove('hide');ui();lastInteract=performance.now();
}
$('replay').addEventListener('click',reset);
$('share').addEventListener('click',async()=>{
  const d={title:'Happy Diwali 🎆',text:'Hold, charge, release — Happy Diwali from Pranav Gupta!',url:location.href};
  try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);$('share').textContent='Link copied ✓'}}catch(e){}
});
$('auto').addEventListener('click',()=>{
  $('auto').classList.remove('show');lastInteract=performance.now()+1e9;
  const left=3-stage;for(let k=0;k<left;k++)setTimeout(()=>{if(stage<3)launchWord(W*rnd(.3,.7),H-14,.85)},k*3300);
});
setInterval(()=>{if(!finale&&stage===0&&!ptr&&performance.now()-lastInteract>6500)$('auto').classList.add('show')},800);

// ---------- input ----------
addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  try{AC()}catch(_){}
  lastInteract=performance.now();$('auto').classList.remove('show');
  ptr={x:e.clientX,y:e.clientY,t0:performance.now(),moved:0};
  if(!finale&&stage<3&&!busy)chargeStart();
});
addEventListener('pointermove',e=>{
  if(!ptr)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y,dist=Math.hypot(dx,dy);ptr.moved+=dist;
  if(finale){const n=Math.max(1,Math.floor(dist/4));for(let i=0;i<n;i++){const u=i/n;sparkle(ptr.x+dx*u,ptr.y+dy*u)}}
  ptr.x=e.clientX;ptr.y=e.clientY;
});
function sparkle(x,y){for(let i=0;i<3;i++){const a=rnd(0,TAU),sp=rnd(.5,3.2);
  addSpark({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.6,a:1,d:rnd(.02,.05),h:rnd(30,52),g:.07,k:0,l:72})}}
function endPtr(){
  if(!ptr)return;const p=ptr;ptr=null;chargeStop();
  if(finale){if(performance.now()-p.t0<260&&p.moved<14)launchPlain(p.x,p.y);return}
  if(stage>=3)return;
  if(busy){return}
  const power=clamp((performance.now()-p.t0)/1100,0,1);
  if(power<.28){for(let i=0;i<14;i++)sparkle(p.x,p.y);$('hintT').textContent='Hold a little longer — let the ring fill ✨';setTimeout(ui,2200);return}
  launchWord(p.x,Math.max(p.y,textCY+90),power);
}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);

// ---------- simulation (fixed 60Hz step) ----------
function step(now){
  // charge
  if(ptr&&!finale&&stage<3&&!busy){
    chargeP=clamp((now-ptr.t0)/1100,0,1);chargeUpdate(chargeP);
    for(let i=0;i<1+Math.floor(chargeP*4);i++){const a=rnd(0,TAU),r=34,sp=rnd(1,3+chargeP*4);
      addSpark({x:ptr.x+Math.cos(a)*r,y:ptr.y+Math.sin(a)*r,vx:Math.cos(a)*sp*.5-Math.sin(a)*1.5,vy:Math.sin(a)*sp*.5+Math.cos(a)*1.5,a:1,d:.05,h:rnd(30,50),g:0,k:1,s:1.6,l:70})}
    if(chargeP>=1&&!ptr.full){ptr.full=true;vib(40)}
  }else chargeP=0;
  // dissolve current word after hold time (words 0,1)
  if(P.length&&holdUntil&&now>holdUntil){dissolve();holdUntil=0}
  // word particles
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    if(p.phase===3){p.vy+=.06;p.x+=p.vx;p.y+=p.vy;p.a-=p.fd;if(p.a<=0)P.splice(i,1);continue}
    if(p.delay>0){p.delay--;p.vx*=.96;p.vy*=.96}
    else{p.vx=(p.vx+(p.tx-p.x)*.03)*.88;p.vy=(p.vy+(p.ty-p.y)*.03)*.88}
    p.x+=p.vx;p.y+=p.vy;
  }
  // rockets
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.u+=r.du;const u=Math.min(1,r.u),e=1-Math.pow(1-u,2);
    r.x=r.sx+(r.tx-r.sx)*e+Math.sin(u*18)*3*(1-u);r.y=r.sy+(r.ty-r.sy)*e;
    for(let k=0;k<2;k++)addSpark({x:r.x,y:r.y,vx:rnd(-.4,.4),vy:rnd(.4,1.6),a:.9,d:.045,h:rnd(25,50),g:.02,k:1,s:1.4,l:70});
    if(r.u>=1){rockets.splice(i,1);explode(r)}}
  // sparks
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+s.g;s.a-=s.d;if(s.a<=0)sparks.splice(i,1)}
  // smoke
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.r+=.3;s.x+=s.vx;s.y-=.05;s.a-=.0004;if(s.a<=0)smoke.splice(i,1)}
  // fountains (anar)
  for(let i=fountains.length-1;i>=0;i--){const f=fountains[i];if(now>f.until){fountains.splice(i,1);continue}
    for(let k=0;k<3;k++)addSpark({x:f.x,y:f.y,vx:rnd(-1.8,1.8),vy:-rnd(6,11)*clamp(H/700,.7,1.2),a:1,d:rnd(.012,.024),h:rnd(32,52),g:.17,k:1,s:1.6,l:74})}
  // chakri (ground spinner)
  for(let i=chakris.length-1;i>=0;i--){const c=chakris[i];if(now>c.until){chakris.splice(i,1);continue}
    c.w=Math.min(.55,c.w+.002);c.ang+=c.w;
    for(let k=0;k<4;k++){const a=c.ang+k*TAU/4;addSpark({x:c.x+Math.cos(a)*14,y:c.y+Math.sin(a)*14,vx:-Math.sin(a)*4.5+rnd(-.5,.5),vy:Math.cos(a)*4.5+rnd(-.5,.5),a:1,d:.04,h:rnd(25,55),g:.04,k:0,l:68})}}
  if(finale&&Math.random()<.016)launchPlain(rnd(W*.1,W*.9),rnd(H*.08,H*.5));
  if(finale&&ptr&&performance.now()-ptr.t0>120)sparkle(ptr.x,ptr.y);
}

// ---------- drawing ----------
const pal=[[255,176,40],[255,61,139],[40,205,195],[255,238,160],[175,95,255]];
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
function draw(now){
  const t=now,bright=stage/3*.6+(finale?.4:0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#03010a');sky.addColorStop(.6,'#120826');sky.addColorStop(1,'#2e0f1c');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ctx.globalAlpha=.3+.7*Math.abs(Math.sin(t*.001+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,TAU);ctx.fill()});
  ctx.globalAlpha=1;
  const hg=ctx.createRadialGradient(W/2,H,0,W/2,H,Math.max(W,H)*(.35+bright*.3));hg.addColorStop(0,'rgba(255,140,30,'+(.08+bright*.14)+')');hg.addColorStop(1,'rgba(255,140,30,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);
  // smoke
  smoke.forEach(s=>{ctx.fillStyle='rgba(135,110,170,'+s.a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()});
  // skyline
  const lf=stage/3*.35+(finale?.65:0);
  buildings.forEach(b=>{
    ctx.fillStyle='#0a0513';ctx.fillRect(b.x,H-b.h,b.w,b.h);
    if(b.spire){ctx.beginPath();ctx.moveTo(b.x+b.w*.2,H-b.h);ctx.lineTo(b.x+b.w/2,H-b.h-b.w*.55);ctx.lineTo(b.x+b.w*.8,H-b.h);ctx.fill()}
    if(b.dome){ctx.beginPath();ctx.arc(b.x+b.w/2,H-b.h,b.w*.36,Math.PI,0);ctx.fill();ctx.fillRect(b.x+b.w/2-1,H-b.h-b.w*.36-8,2,8)}
    b.win.forEach(w=>{if(w.th<lf){ctx.fillStyle='rgba(255,'+(190+w.th*50|0)+',90,'+(.5+.3*Math.sin(t*.003+w.x))+')';ctx.fillRect(w.x,w.y,4,6)}});
  });
  // string lights
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;
  wires.forEach(w=>{ctx.beginPath();ctx.moveTo(w[0],w[1]);ctx.quadraticCurveTo(w[2],w[3],w[4],w[5]);ctx.stroke()});
  ctx.globalCompositeOperation='lighter';
  bulbs.forEach((b,i)=>{
    let br=(.3+.7*bright)*(.7+.3*Math.sin(t*.004+b.ph));if(finale)br=.6+.4*Math.sin(t*.008-i*.5);
    const c=pal[b.c];ctx.fillStyle=rgba(c,.15*br);ctx.beginPath();ctx.arc(b.x,b.y,9,0,TAU);ctx.fill();
    ctx.fillStyle=rgba(c,.35+.65*br);ctx.beginPath();ctx.arc(b.x,b.y,2.8,0,TAU);ctx.fill();
  });
  // chakri discs
  chakris.forEach(c=>{ctx.strokeStyle='rgba(255,170,60,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,14,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(255,230,160,.9)';ctx.beginPath();ctx.arc(c.x+Math.cos(c.ang)*14,c.y+Math.sin(c.ang)*14,3,0,TAU);ctx.fill()});
  // word particles
  for(let i=0;i<P.length;i++){const p=P[i];
    const tw=.65+.35*Math.sin(t*.008+p.ph),al=p.a*tw;
    ctx.fillStyle=p.col;ctx.globalAlpha=al*.28;ctx.fillRect(p.x-p.s*1.8,p.y-p.s*1.8,p.s*3.6,p.s*3.6);
    ctx.globalAlpha=al;ctx.fillRect(p.x-p.s*.6,p.y-p.s*.6,p.s*1.2,p.s*1.2);
  }
  ctx.globalAlpha=1;
  // sparks
  ctx.lineCap='round';
  for(let i=0;i<sparks.length;i++){const s=sparks[i];
    if(s.k===0){ctx.strokeStyle='hsla('+s.h+',100%,'+(s.l-10+s.a*25)+'%,'+s.a+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*2.2,s.y-s.vy*2.2);ctx.stroke()}
    else{ctx.fillStyle='hsla('+s.h+',100%,'+s.l+'%,'+s.a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,TAU);ctx.fill()}
  }
  // rockets
  rockets.forEach(r=>{ctx.fillStyle='hsl('+r.hue+',100%,80%)';ctx.beginPath();ctx.arc(r.x,r.y,2.6,0,TAU);ctx.fill();
    const g=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,16);g.addColorStop(0,'rgba(255,200,100,.5)');g.addColorStop(1,'rgba(255,150,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(r.x,r.y,16,0,TAU);ctx.fill()});
  // charge ring
  if(ptr&&!finale&&stage<3&&!busy){
    const R=34+chargeP*6;
    const g=ctx.createRadialGradient(ptr.x,ptr.y,0,ptr.x,ptr.y,R*2);g.addColorStop(0,rgba([255,190,80],.18+chargeP*.4));g.addColorStop(1,'rgba(255,150,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ptr.x,ptr.y,R*2,0,TAU);ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,211,107,.25)';ctx.beginPath();ctx.arc(ptr.x,ptr.y,R,0,TAU);ctx.stroke();
    ctx.lineWidth=5;ctx.strokeStyle=chargeP>=1?'#fff6c9':'#ffd36b';ctx.beginPath();ctx.arc(ptr.x,ptr.y,R,-Math.PI/2,-Math.PI/2+TAU*chargeP);ctx.stroke();
    const ta=-Math.PI/2+TAU*.28;ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(ptr.x+Math.cos(ta)*R,ptr.y+Math.sin(ta)*R,2.5,0,TAU);ctx.fill();
    if(chargeP>=1){ctx.font='700 14px Georgia,serif';ctx.textAlign='center';ctx.fillStyle='#fff6c9';ctx.fillText('RELEASE!',ptr.x,ptr.y-R-12)}
  }
  // sparkler head
  if(ptr&&finale){const g=ctx.createRadialGradient(ptr.x,ptr.y,0,ptr.x,ptr.y,26);g.addColorStop(0,'rgba(255,255,230,.95)');g.addColorStop(.3,'rgba(255,200,90,.5)');g.addColorStop(1,'rgba(255,140,30,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ptr.x,ptr.y,26,0,TAU);ctx.fill()}
  ctx.globalCompositeOperation='source-over';
}

let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;let n=0;
  while(acc>=16.667&&n<5){step(now);acc-=16.667;n++}
  draw(now);requestAnimationFrame(frame);
}
ui();requestAnimationFrame(frame);
})();
</script>
</body>
