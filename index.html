<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040f">
<title>Happy Diwali from Pranav Gupta 🪔</title>
<meta property="og:title" content="Happy Diwali from Pranav Gupta 🪔">
<meta property="og:description" content="A Diwali night on the river. Just watch.">
<style>
  :root{--gold:#ffd36b;--orange:#ff8a1f;--pink:#ff3d8b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#02040f;color:#fff;font-family:Georgia,"Times New Roman",serif;
            touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;inset:0;pointer-events:none}

  #mute{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 34px);right:12px;width:40px;height:40px;border-radius:50%;
        border:1px solid rgba(255,211,107,.35);background:rgba(8,10,28,.5);color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #chip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);text-align:center;font-size:clamp(12px,3.4vw,15px);letter-spacing:.14em;
        color:#cdbbe0;text-shadow:0 2px 12px #000;animation:pulse 2.6s infinite;transition:opacity .8s}
  #chip.hide{opacity:0;visibility:hidden}
  @keyframes pulse{50%{opacity:.45}}

  #card{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);width:min(92vw,560px);padding:clamp(12px,2.4vh,22px) 18px clamp(12px,2.2vh,18px);
        border-radius:24px;background:rgba(6,8,24,.55);border:1px solid rgba(255,211,107,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        text-align:center;opacity:0;visibility:hidden;transform:translate(-50%,24px) scale(.96);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,1.2,.4,1)}
  #card.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
  #forLine{display:none;font-size:clamp(12px,3.2vw,15px);letter-spacing:.2em;text-transform:uppercase;color:#c9b6dd;margin-bottom:4px}
  h1{font-size:clamp(34px,min(11.5vw,9.5vh),84px);line-height:1.05;font-weight:700;white-space:nowrap}
  h1 span{display:inline-block;opacity:0;transform:translateY(20px) scale(.7);filter:blur(8px);
          background:linear-gradient(180deg,#fff8d6,var(--gold) 50%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .sp{width:.26em}
  #card.show h1 span{animation:rise .9s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--i)*70ms + 300ms)}
  @keyframes rise{to{opacity:1;transform:none;filter:drop-shadow(0 0 12px rgba(255,150,40,.7))}}
  .hi{font-size:clamp(16px,min(5vw,4vh),30px);color:#ffe6c0;text-shadow:0 0 16px rgba(255,140,40,.8);font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",serif;margin-top:2px}
  .from{margin-top:.35em;font-size:clamp(15px,min(4.4vw,3.6vh),26px);color:#ffe6c0;font-style:italic}
  .from b{font-style:normal;letter-spacing:.09em;text-transform:uppercase;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tip{margin-top:8px;font-size:clamp(11px,3vw,13px);color:#a995bd;letter-spacing:.06em}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .btns button{pointer-events:auto;padding:9px 20px;border-radius:40px;border:1px solid rgba(255,211,107,.55);background:rgba(255,160,50,.14);color:var(--gold);
               font:inherit;font-size:clamp(13px,3.5vw,15px);letter-spacing:.08em;cursor:pointer}
  .btns button:active{transform:scale(.96)}

  @media (max-height:520px) and (orientation:landscape){
    #chip{bottom:8px}
    #card{padding:8px 14px;border-radius:16px;bottom:8px}
    .hi,.tip{display:none}.btns{margin-top:6px}
    #mute{top:30px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <button id="mute" aria-label="Toggle sound">🔊</button>
  <p id="chip">tap anywhere for sound &amp; fireworks</p>
  <div id="card">
    <p id="forLine"></p>
    <h1 id="h1" aria-label="Happy Diwali"></h1>
    <p class="hi">शुभ दीपावली</p>
    <p class="from">from <b>Pranav Gupta</b></p>
    <p class="tip">Tap for fireworks · drag to write with a sparkler</p>
    <div class="btns"><button id="share">Share ✨</button><button id="replay">Replay ↺</button></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let W=0,H=0,DPR=1,textCY=0,horizon=0;

const to=(new URLSearchParams(location.search).get('to')||'').slice(0,24).replace(/[<>&"]/g,'');
if(to){$('forLine').textContent='for '+to;$('forLine').style.display='block'}
[...'Happy Diwali'].forEach((ch,i)=>{const s=document.createElement('span');s.style.setProperty('--i',i);if(ch===' '){s.className='sp';s.innerHTML='&nbsp;'}else s.textContent=ch;$('h1').appendChild(s)});

// ---------- state ----------
let simT=0,finale=false,audioOn=false,muted=false,ptr=null,lightLevel=.08,holdUntil=0;
const sched=[],P=[],sparks=[],rockets=[],smoke=[],fountains=[],chakris=[],lanterns=[],ripples=[];
const stars=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6}));
let shore=[],lamps=[],hills=[],bulbs=[],wires=[],diyas=[];
const HOLD=2600;
const at=(ms,fn)=>sched.push({t:simT+ms,fn});

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  horizon=H*(H<500?.62:.6);textCY=horizon*.5;
  const sc=clamp(W/420,.8,1.6);
  // far hills
  let r=rng(3);hills=[];for(let x=0;x<=W+40;x+=40)hills.push([x,horizon-(.02+.025*Math.sin(x*.012)+.015*r())*H]);
  // shore silhouette
  r=rng(5);shore=[];let x=-10;
  while(x<W+10){
    const k=r();let kind='block',w=(22+r()*46)*sc,h=(.025+r()*.06)*H;
    if(k<.16){kind='temple';w=(40+r()*28)*sc;h=(.07+r()*.06)*H}else if(k<.27){kind='dome';w=(30+r()*20)*sc;h=(.04+r()*.04)*H}else if(k<.5){kind='tree';w=(24+r()*20)*sc;h=(.03+r()*.04)*H}
    shore.push({x,w,h,kind,th:r()});x+=w*(.55+r()*.45);
  }
  lamps=[];for(let lx=3;lx<W;lx+=7+r()*8)lamps.push({x:lx,th:r()});
  // garland of lights
  bulbs=[];wires=[];const segs=Math.max(2,Math.round(W/230)),sw=W/segs,sag=clamp(W*.045,14,26),y0=6;
  for(let s=0;s<segs;s++){
    const ax=s*sw,bx=(s+1)*sw,cx=(ax+bx)/2,cy=y0+sag*2;wires.push([ax,y0,cx,cy,bx,y0]);
    const n=Math.max(4,Math.round(sw/30));
    for(let k=1;k<n;k++){const u=k/n;bulbs.push({x:(1-u)*(1-u)*ax+2*(1-u)*u*cx+u*u*bx,y:(1-u)*(1-u)*y0+2*(1-u)*u*cy+u*u*y0+3,c:(s*7+k)%5,ph:Math.random()*6})}
  }
  // floating diyas on the river
  if(!diyas.length||true){
    const n=Math.round(clamp(W/20,15,38));diyas=[];
    for(let i=0;i<n;i++)diyas.push({d:Math.pow(Math.random(),.8),x:rnd(0,W),th:Math.random(),glow:0,ph:rnd(0,6)});
    diyas.sort((a,b)=>a.d-b.d);
  }
}
addEventListener('resize',resize);resize();

// ---------- sound ----------
let ac;
function AC(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
const on=()=>audioOn&&!muted;
function noise(dur,fn){const a=AC(),n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=fn(i/n);return b}
function boom(big){if(!on())return;try{const a=AC(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noise(.5,t=>(Math.random()*2-1)*Math.pow(1-t,3));f.type='lowpass';f.frequency.value=big?420:300;g.gain.value=big?.26:.14;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
  const c=a.createBufferSource(),cg=a.createGain();c.buffer=noise(.9,t=>Math.random()<.006?(Math.random()*2-1)*(1-t):0);cg.gain.value=.5;c.connect(cg);cg.connect(a.destination);c.start(a.currentTime+.12)}catch(e){}}
function whoosh(){if(!on())return;try{const a=AC(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;
  s.buffer=noise(1.2,x=>(Math.random()*2-1));f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2600,t+1.1);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.1,t+.2);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
function chime(){if(!on())return;try{const a=AC(),t=a.currentTime;[523.25,659.25,783.99,1046.5].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.11,t+i*.12+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+1.6);
  o.connect(g);g.connect(a.destination);o.start(t+i*.12);o.stop(t+i*.12+1.7)})}catch(e){}}
function bell(){if(!on())return;try{const a=AC(),t=a.currentTime;[196,392,588,1176].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16/(i+1),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+3.3)})}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'});

// ---------- effects ----------
function addSpark(s){if(sparks.length<2200)sparks.push(s)}
function burst(x,y,hue,n,spd){
  boom(n>70);
  const kind=Math.random(),k=clamp(W/700,.7,1.2)*(spd||1);
  for(let i=0;i<n;i++){
    const a=i/n*TAU;let sp=kind<.4?4.2:kind<.7?rnd(2,6):(i%2?5:2.5),vx=Math.cos(a)*sp*k,vy=Math.sin(a)*sp*k;
    if(kind>.88){vx=16*Math.pow(Math.sin(a),3)*.28*k;vy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*.28*k}
    addSpark({x,y,vx,vy,a:1,d:rnd(.011,.021),h:(hue+rnd(0,50))%360,g:.045,k:0,l:60});
  }
  for(let i=0;i<3;i++)smoke.push({x:x+rnd(-30,30),y:y+rnd(-20,20),r:rnd(30,60),a:.06,vx:rnd(-.15,.15)});
}
function launchPlain(tx,ty){
  ty=Math.min(ty,horizon-40);
  rockets.push({sx:clamp(tx+rnd(-60,60),10,W-10),sy:horizon-4,tx,ty,u:0,du:1/rnd(55,80),word:-1,power:.6,hue:rnd(0,360)});whoosh();
}
function sendWord(w){
  dissolve();
  rockets.push({sx:W/2+rnd(-W*.22,W*.22),sy:horizon-4,tx:W/2,ty:textCY,u:0,du:1/80,word:w,power:.9,hue:rnd(20,60)});
  whoosh();vib(25);
}
function dissolve(){P.forEach(p=>{if(p.phase<3){p.phase=3;p.vx=rnd(-1.3,1.3);p.vy=rnd(-2,.3);p.fd=rnd(.008,.022)}})}

// ---------- text -> particles ----------
function getLines(i){
  if(i===0)return[{t:'HAPPY',s:1}];
  if(i===1)return[{t:'DIWALI',s:1}];
  return W<H?[{t:'from',s:.42,serif:1},{t:'PRANAV',s:1},{t:'GUPTA',s:1}]:[{t:'from',s:.4,serif:1},{t:'PRANAV GUPTA',s:1}];
}
function buildTargets(lines){
  const fontOf=(l,px)=>l.serif?'italic 700 '+px+'px Georgia,"Times New Roman",serif':'900 '+px+'px "Arial Black","Helvetica Neue",Impact,Arial,sans-serif';
  const o=document.createElement('canvas');o.width=W;o.height=H;const oc=o.getContext('2d',{willReadFrequently:true});
  const maxW=W*.88,maxH=horizon*(W<H?.62:.7);let base=Math.min(H*.2,170),sumS=0;
  lines.forEach(l=>{oc.font=fontOf(l,100);const m=oc.measureText(l.t).width;base=Math.min(base,maxW*100/(m*l.s));sumS+=l.s*1.15});
  base=Math.min(base,maxH/sumS);
  let y=textCY-base*sumS/2;oc.fillStyle='#fff';oc.textAlign='center';oc.textBaseline='middle';
  lines.forEach(l=>{const lh=base*l.s*1.15;oc.font=fontOf(l,base*l.s);oc.fillText(l.t,W/2,y+lh/2);y+=lh});
  const data=oc.getImageData(0,0,W,H).data;let step=clamp(Math.round(base/15),3,7),pts;
  for(let tries=0;tries<4;tries++){
    pts=[];for(let yy=0;yy<H;yy+=step)for(let xx=0;xx<W;xx+=step)if(data[(yy*W+xx)*4+3]>140)pts.push({x:xx+rnd(-.8,.8),y:yy+rnd(-.8,.8)});
    if(pts.length<=1500)break;step++;
  }
  return pts;
}
function formWord(i,bx,by){
  const pts=buildTargets(getLines(i)),cols=i===2?[42,48,332,30]:[40,46,50,36];
  pts.forEach(t=>{const a=rnd(0,TAU),sp=rnd(2,10),h=cols[Math.floor(Math.random()*cols.length)];
    P.push({x:bx,y:by,tx:t.x,ty:t.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,delay:Math.floor(rnd(0,22)),phase:0,a:1,ph:rnd(0,6),fd:0,
            col:'hsl('+h+',100%,'+Math.floor(rnd(60,86))+'%)',s:rnd(1.1,1.9)})});
  holdUntil=simT+HOLD;
}
function explode(r){
  burst(r.tx,r.ty,r.hue,Math.round(52+r.power*44));
  if(r.word>=0){
    formWord(r.word,r.tx,r.ty);chime();lightLevel=[.4,.7,1][r.word];
    for(let i=0;i<4;i++)at(200+i*260,()=>burst(rnd(W*.1,W*.9),rnd(H*.06,horizon-60),rnd(0,360),rnd(34,52),.8));
    if(r.word===2)at(2400,startFinale);
  }
}

// ---------- the show ----------
function startShow(){
  at(900,()=>sendWord(0));
  at(4900,()=>sendWord(1));
  at(8900,()=>sendWord(2));
}
function startFinale(){
  if(finale)return;finale=true;lightLevel=1;bell();
  $('chip').classList.add('hide');$('card').classList.add('show');vib([40,60,40,60,120]);
  at(500,dissolve);
  for(let k=0;k<12;k++)at(k*320,()=>launchPlain(rnd(W*.08,W*.92),rnd(H*.06,horizon-50)));
  [.1,.9,.32,.68].forEach((fx,i)=>fountains.push({x:W*fx,y:horizon-3,until:simT+9000+i*500}));
  [.2,.8].forEach(fx=>chakris.push({x:W*fx,y:horizon+(H-horizon)*.24,until:simT+8000,ang:0,w:.05}));
}
function reset(){
  finale=false;P.length=0;sparks.length=0;rockets.length=0;fountains.length=0;chakris.length=0;lanterns.length=0;sched.length=0;
  lightLevel=.08;holdUntil=0;$('card').classList.remove('show');startShow();
}
$('replay').addEventListener('click',reset);
$('share').addEventListener('click',async()=>{
  const d={title:'Happy Diwali 🪔',text:'A Diwali night on the river — Happy Diwali from Pranav Gupta!',url:location.href};
  try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);$('share').textContent='Link copied ✓'}}catch(e){}
});
startShow();

// ---------- input ----------
function sparkle(x,y){for(let i=0;i<3;i++){const a=rnd(0,TAU),sp=rnd(.5,3.2);
  addSpark({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.6,a:1,d:rnd(.02,.05),h:rnd(30,52),g:.07,k:1,s:1.5,l:72})}}
addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  if(!audioOn){audioOn=true;try{AC()}catch(_){}$('chip').classList.add('hide')}
  ptr={x:e.clientX,y:e.clientY,t0:performance.now(),moved:0};
});
addEventListener('pointermove',e=>{
  if(!ptr)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y,dist=Math.hypot(dx,dy);ptr.moved+=dist;
  const n=Math.max(1,Math.floor(dist/4));for(let i=0;i<n;i++){const u=i/n;sparkle(ptr.x+dx*u,ptr.y+dy*u)}
  ptr.x=e.clientX;ptr.y=e.clientY;
});
function endPtr(){
  if(!ptr)return;const p=ptr;ptr=null;
  if(performance.now()-p.t0<260&&p.moved<14){
    if(p.y>horizon)ripples.push({x:p.x,y:p.y,r:4,a:.8});
    launchPlain(p.x,p.y>horizon?rnd(H*.1,horizon-60):p.y);
  }
}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);

// ---------- simulation (fixed 60Hz) ----------
function step(){
  simT+=16.667;
  for(let i=sched.length-1;i>=0;i--)if(sched[i].t<=simT){const f=sched.splice(i,1)[0].fn;f()}
  if(P.length&&holdUntil&&simT>holdUntil){dissolve();holdUntil=0}
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    if(p.phase===3){p.vy+=.06;p.x+=p.vx;p.y+=p.vy;p.a-=p.fd;if(p.a<=0)P.splice(i,1);continue}
    if(p.delay>0){p.delay--;p.vx*=.96;p.vy*=.96}
    else{p.vx=(p.vx+(p.tx-p.x)*.03)*.88;p.vy=(p.vy+(p.ty-p.y)*.03)*.88}
    p.x+=p.vx;p.y+=p.vy;
  }
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.u+=r.du;const u=Math.min(1,r.u),e=1-Math.pow(1-u,2);
    r.x=r.sx+(r.tx-r.sx)*e+Math.sin(u*18)*3*(1-u);r.y=r.sy+(r.ty-r.sy)*e;
    for(let k=0;k<2;k++)addSpark({x:r.x,y:r.y,vx:rnd(-.4,.4),vy:rnd(.4,1.6),a:.9,d:.045,h:rnd(25,50),g:.02,k:1,s:1.4,l:70});
    if(r.u>=1){rockets.splice(i,1);explode(r)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy=s.vy*.985+s.g;s.a-=s.d;if(s.a<=0)sparks.splice(i,1)}
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.r+=.3;s.x+=s.vx;s.y-=.05;s.a-=.0004;if(s.a<=0)smoke.splice(i,1)}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=1.3;r.a-=.012;if(r.a<=0)ripples.splice(i,1)}
  for(let i=fountains.length-1;i>=0;i--){const f=fountains[i];if(simT>f.until){fountains.splice(i,1);continue}
    for(let k=0;k<3;k++)addSpark({x:f.x,y:f.y,vx:rnd(-1.4,1.4),vy:-rnd(4.5,8)*clamp(H/700,.7,1.2),a:1,d:rnd(.014,.026),h:rnd(32,52),g:.14,k:1,s:1.5,l:74})}
  for(let i=chakris.length-1;i>=0;i--){const c=chakris[i];if(simT>c.until){chakris.splice(i,1);continue}
    c.w=Math.min(.55,c.w+.002);c.ang+=c.w;
    for(let k=0;k<4;k++){const a=c.ang+k*TAU/4;addSpark({x:c.x+Math.cos(a)*14,y:c.y+Math.sin(a)*14,vx:-Math.sin(a)*4.5+rnd(-.5,.5),vy:Math.cos(a)*4.5+rnd(-.5,.5),a:1,d:.04,h:rnd(25,55),g:.04,k:0,l:68})}}
  // diyas drift & glow
  diyas.forEach(d=>{d.x+=.05+d.d*.16;if(d.x>W+30)d.x=-30;const tg=d.th<lightLevel?1:0;d.glow+=(tg-d.glow)*.025});
  // lanterns (finale)
  if(finale&&Math.random()<.025)lanterns.push({x:rnd(W*.05,W*.95),y:H+30,vy:rnd(.4,.9),sc:rnd(.7,1.4),ph:rnd(0,6),hue:rnd(22,48)});
  for(let i=lanterns.length-1;i>=0;i--){const l=lanterns[i];l.y-=l.vy;l.x+=Math.sin(simT*.0012+l.ph)*.35;if(l.y<-60)lanterns.splice(i,1)}
  if(finale&&Math.random()<.014)launchPlain(rnd(W*.08,W*.92),rnd(H*.06,horizon-50));
  if(ptr&&performance.now()-ptr.t0>140)sparkle(ptr.x,ptr.y);
}

// ---------- drawing ----------
const pal=[[255,176,40],[255,61,139],[40,205,195],[255,238,160],[175,95,255]];
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
function drawShore(){
  ctx.fillStyle='#0b1232';ctx.beginPath();ctx.moveTo(0,horizon);hills.forEach(h=>ctx.lineTo(h[0],h[1]));ctx.lineTo(W+40,horizon);ctx.closePath();ctx.fill();
  ctx.fillStyle='#050714';
  shore.forEach(b=>{const bx=b.x,by=horizon,cx=bx+b.w/2;
    if(b.kind==='block'){ctx.fillRect(bx,by-b.h,b.w,b.h);if(b.th<lightLevel){ctx.fillStyle='rgba(255,190,90,.8)';ctx.fillRect(bx+b.w*.3,by-b.h*.6,3,5);ctx.fillRect(bx+b.w*.6,by-b.h*.4,3,5);ctx.fillStyle='#050714'}}
    else if(b.kind==='temple'){
      ctx.fillRect(bx+b.w*.12,by-b.h*.4,b.w*.76,b.h*.4);
      ctx.beginPath();ctx.moveTo(cx-b.w*.34,by-b.h*.4);ctx.quadraticCurveTo(cx-b.w*.26,by-b.h*.85,cx,by-b.h);ctx.quadraticCurveTo(cx+b.w*.26,by-b.h*.85,cx+b.w*.34,by-b.h*.4);ctx.fill();
      ctx.fillRect(cx-1,by-b.h-9,2,9);
      if(b.th<lightLevel){ctx.fillStyle='rgba(255,170,70,.95)';[.3,.5,.7].forEach(f=>{ctx.beginPath();ctx.arc(bx+b.w*f,by-b.h*.12,1.8,0,TAU);ctx.fill()});
        ctx.fillStyle='rgba(255,200,110,.9)';ctx.beginPath();ctx.arc(cx,by-b.h-11,2,0,TAU);ctx.fill();ctx.fillStyle='#050714'}
    }
    else if(b.kind==='dome'){ctx.fillRect(bx,by-b.h*.55,b.w,b.h*.55);ctx.beginPath();ctx.arc(cx,by-b.h*.55,b.w*.4,Math.PI,0);ctx.fill();ctx.fillRect(cx-1,by-b.h*.55-b.w*.4-7,2,7)}
    else{ctx.fillRect(cx-1.5,by-b.h*.4,3,b.h*.4);ctx.beginPath();ctx.ellipse(cx,by-b.h*.62,b.w*.42,b.h*.38,0,0,TAU);ctx.fill()}
  });
}
function drawFx(mul,refl){
  ctx.globalAlpha=mul;
  for(let i=0;i<P.length;i++){const p=P[i];
    const tw=.65+.35*Math.sin(simT*.008+p.ph),al=p.a*tw*mul;ctx.fillStyle=p.col;
    if(!refl){ctx.globalAlpha=al*.28;ctx.fillRect(p.x-p.s*1.8,p.y-p.s*1.8,p.s*3.6,p.s*3.6)}
    ctx.globalAlpha=al;ctx.fillRect(p.x-p.s*.6,p.y-p.s*.6,p.s*1.2,p.s*1.2);
  }
  ctx.globalAlpha=mul;ctx.lineCap='round';
  for(let i=0;i<sparks.length;i++){const s=sparks[i];
    if(s.k===0){ctx.strokeStyle='hsla('+s.h+',100%,'+(s.l-10+s.a*25)+'%,'+s.a+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*2.2,s.y-s.vy*2.2);ctx.stroke()}
    else{ctx.fillStyle='hsla('+s.h+',100%,'+s.l+'%,'+s.a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,TAU);ctx.fill()}
  }
  ctx.globalAlpha=1;
}
function draw(t){
  const lv=lightLevel;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  // sky
  const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#01030c');sky.addColorStop(.55,'#0a1538');sky.addColorStop(.85,'#26204f');sky.addColorStop(1,'#5a2a4a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon+1);
  stars.forEach(s=>{ctx.globalAlpha=.3+.7*Math.abs(Math.sin(t*.001+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*horizon*.85,s.r,0,TAU);ctx.fill()});
  ctx.globalAlpha=1;
  // drifting colour mist
  ctx.globalCompositeOperation='lighter';
  [[.25,.35,'60,40,130'],[.75,.5,'20,90,110']].forEach((m,i)=>{const mx=W*(m[0]+.05*Math.sin(t*.0001+i)),my=horizon*m[1],g=ctx.createRadialGradient(mx,my,0,mx,my,W*.6);
    g.addColorStop(0,'rgba('+m[2]+',.16)');g.addColorStop(1,'rgba('+m[2]+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon)});
  const hg=ctx.createRadialGradient(W/2,horizon,0,W/2,horizon,W*.7);hg.addColorStop(0,'rgba(255,140,40,'+(.1+lv*.3)+')');hg.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=hg;ctx.fillRect(0,0,W,horizon);
  ctx.globalCompositeOperation='source-over';
  smoke.forEach(s=>{ctx.fillStyle='rgba(150,120,190,'+s.a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()});
  drawShore();
  // garland
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;
  wires.forEach(w=>{ctx.beginPath();ctx.moveTo(w[0],w[1]);ctx.quadraticCurveTo(w[2],w[3],w[4],w[5]);ctx.stroke()});
  ctx.globalCompositeOperation='lighter';
  bulbs.forEach((b,i)=>{let br=(.3+.7*lv)*(.7+.3*Math.sin(t*.004+b.ph));if(finale)br=.6+.4*Math.sin(t*.008-i*.5);
    const c=pal[b.c];ctx.fillStyle=rgba(c,.15*br);ctx.beginPath();ctx.arc(b.x,b.y,9,0,TAU);ctx.fill();ctx.fillStyle=rgba(c,.35+.65*br);ctx.beginPath();ctx.arc(b.x,b.y,2.8,0,TAU);ctx.fill()});
  // shore lamps
  lamps.forEach(l=>{if(l.th<lv){const f=.6+.4*Math.sin(t*.005+l.x);ctx.fillStyle='rgba(255,180,70,'+.9*f+')';ctx.fillRect(l.x,horizon-2,2,2);
    ctx.fillStyle='rgba(255,150,50,'+.22*f+')';ctx.fillRect(l.x+Math.sin(t*.003+l.x)*1.2,horizon+1,2,10+l.th*22)}});
  ctx.globalCompositeOperation='source-over';
  // water
  const wg=ctx.createLinearGradient(0,horizon,0,H);wg.addColorStop(0,'#17204f');wg.addColorStop(.35,'#0b1233');wg.addColorStop(1,'#03050f');
  ctx.fillStyle=wg;ctx.fillRect(0,horizon+1,W,H-horizon);
  ctx.globalCompositeOperation='lighter';
  const wl=ctx.createRadialGradient(W/2,horizon,0,W/2,horizon,W*.65);wl.addColorStop(0,'rgba(255,140,40,'+(.05+lv*.2)+')');wl.addColorStop(1,'rgba(255,140,40,0)');
  ctx.fillStyle=wl;ctx.fillRect(0,horizon,W,H-horizon);
  // floating diyas
  diyas.forEach(d=>{
    const s=.45+d.d*1.2,y=horizon+16+d.d*(H-horizon-44)+Math.sin(t*.002+d.ph)*1.6*s,x=d.x,w=26*s,g=d.glow;
    if(g>.02){const gr=ctx.createRadialGradient(x,y-w*.2,0,x,y-w*.2,w*2.2);gr.addColorStop(0,'rgba(255,170,60,'+.45*g+')');gr.addColorStop(1,'rgba(255,120,20,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y-w*.2,w*2.2,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,170,60,'+.22*g+')';ctx.beginPath();ctx.ellipse(x+Math.sin(t*.004+d.ph)*w*.06,y+w*.75,w*.16,w*.85,0,0,TAU);ctx.fill()}
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y+w*.2,w*.6,w*.14,0,0,TAU);ctx.fill();
    ctx.fillStyle='#8f3513';ctx.beginPath();ctx.ellipse(x,y,w*.5,w*.24,0,0,Math.PI);ctx.fill();
    ctx.fillStyle='#d9742f';ctx.beginPath();ctx.ellipse(x,y,w*.5,w*.1,0,0,TAU);ctx.fill();
    ctx.fillStyle=g>.3?'#ffb347':'#3a1608';ctx.beginPath();ctx.ellipse(x,y,w*.38,w*.065,0,0,TAU);ctx.fill();
    if(g>.05){const f=.85+.15*Math.sin(t*.02+d.ph*3),fh=w*.5*f*g;ctx.fillStyle='rgba(255,220,120,'+g+')';ctx.beginPath();ctx.ellipse(x,y-fh*.5,w*.07,fh*.5,0,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,240,'+g+')';ctx.beginPath();ctx.ellipse(x,y-fh*.3,w*.03,fh*.28,0,0,TAU);ctx.fill()}
    ctx.globalCompositeOperation='lighter';
  });
  ctx.globalCompositeOperation='source-over';
  // reflection of the fireworks
  ctx.globalCompositeOperation='lighter';
  ctx.save();ctx.beginPath();ctx.rect(0,horizon,W,H-horizon);ctx.clip();ctx.translate(0,2*horizon);ctx.scale(1,-1);drawFx(.3,true);ctx.restore();
  // ripple bands
  ctx.globalCompositeOperation='source-over';
  for(let y=horizon+4;y<H;y+=6){ctx.fillStyle='rgba(4,6,20,.32)';ctx.fillRect(0,y+Math.sin(t*.002+y*.7)*1.6,W,2)}
  ripples.forEach(r=>{ctx.strokeStyle='rgba(255,220,160,'+r.a+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.3,0,0,TAU);ctx.stroke()});
  // chakri discs
  ctx.globalCompositeOperation='lighter';
  chakris.forEach(c=>{ctx.strokeStyle='rgba(255,170,60,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,14,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(255,230,160,.9)';ctx.beginPath();ctx.arc(c.x+Math.cos(c.ang)*14,c.y+Math.sin(c.ang)*14,3,0,TAU);ctx.fill()});
  // sky lanterns
  lanterns.forEach(l=>{const s=l.sc*clamp(W/420,.8,1.3),f=.8+.2*Math.sin(t*.01+l.ph);
    const g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,34*s);g.addColorStop(0,'hsla('+l.hue+',100%,65%,'+.45*f+')');g.addColorStop(1,'hsla('+l.hue+',100%,50%,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(l.x,l.y,34*s,0,TAU);ctx.fill();
    ctx.fillStyle='hsla('+l.hue+',100%,'+(60+f*10)+'%,.9)';ctx.beginPath();ctx.moveTo(l.x-7*s,l.y-9*s);ctx.lineTo(l.x+7*s,l.y-9*s);ctx.lineTo(l.x+10*s,l.y+9*s);ctx.lineTo(l.x-10*s,l.y+9*s);ctx.closePath();ctx.fill()});
  drawFx(1,false);
  // rockets
  rockets.forEach(r=>{ctx.fillStyle='hsl('+r.hue+',100%,80%)';ctx.beginPath();ctx.arc(r.x,r.y,2.6,0,TAU);ctx.fill();
    const g=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,16);g.addColorStop(0,'rgba(255,200,100,.5)');g.addColorStop(1,'rgba(255,150,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(r.x,r.y,16,0,TAU);ctx.fill()});
  // sparkler head
  if(ptr&&ptr.moved>6){const g=ctx.createRadialGradient(ptr.x,ptr.y,0,ptr.x,ptr.y,26);g.addColorStop(0,'rgba(255,255,230,.95)');g.addColorStop(.3,'rgba(255,200,90,.5)');g.addColorStop(1,'rgba(255,140,30,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ptr.x,ptr.y,26,0,TAU);ctx.fill()}
  ctx.globalCompositeOperation='source-over';
}

let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;let n=0;
  while(acc>=16.667&&n<5){step();acc-=16.667;n++}
  draw(now);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
